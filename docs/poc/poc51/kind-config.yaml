# One control-plane node. The kubeadm timeouts are raised because the host
# this ran on was heavily loaded and kubeadm gave up on a node that was slow.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    apiVersion: kubeadm.k8s.io/v1beta4
    timeouts:
      controlPlaneComponentHealthCheck: 10m0s
      kubernetesAPICall: 5m0s
