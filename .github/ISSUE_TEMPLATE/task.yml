name: Task
description: Documentation, maintenance, refactoring or another focused task
title: "chore: "
labels: ["chore", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep a title prefix that matches the work, for example `chore:`,
        `docs:`, `refactor:` or `ci:`. You do not need to apply labels;
        maintainers assign priority, size and phase after triage.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Why is this task needed?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will change, and what is left out.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done When
      description: How completion is shown, and at which level (documentation review, make test, envtest, Kind, VM lab).
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related Work
      description: Dependencies, related issues, PRs or files, if any.
    validations:
      required: false
