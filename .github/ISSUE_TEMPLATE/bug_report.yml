name: Bug Report
description: Report incorrect or unexpected behavior in the CUBRID Kubernetes Operator
title: "fix: "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `fix:` title prefix and name the observed problem.

        Before filing:
        - Search open and recently closed issues for the same behavior.
        - A bug you could not reproduce can still be filed; say so under
          Reproducibility. You do not need to know the cause.
        - Leave out passwords, tokens, kubeconfigs, customer data,
          object-storage credentials and unredacted Secrets.
        - You do not need to apply labels; maintainers assign priority, size
          and phase after triage.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the incorrect or unexpected behavior.
      placeholder: |
        What went wrong?
        Which component or operation was affected?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should happen.
      placeholder: What should the Operator, the Instance Manager, the Broker or the CUBRID cluster do instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what happened, with the important times when you have them.
      placeholder: |
        Example:
        - 15:34:40 the Pod became Ready
        - 15:34:41 the first SQL connection succeeded
        - 15:34:41 the transaction returned error ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Diagnostic Evidence
      description: |
        The evidence you have. Write "not collected" where you have none.
        Remove credentials and sensitive data. The kinds of evidence are those
        of docs/observability.md.
      placeholder: |
        - CubridCluster manifest (redacted):
        - CubridCluster status / Conditions:
        - Kubernetes Events:
        - Pod / container state:
        - Operator log:
        - Instance Manager log:
        - CUBRID log files:
        - SQL result:
        - Metrics:
        - Scenario / workflow run link:
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where the problem was observed.
      placeholder: |
        - Operator version or commit:
        - CUBRID engine version:
        - CUBRID image (tag/digest):
        - Kubernetes distribution and version:
        - Architecture:
        - Container runtime:
        - CSI / StorageClass:
        - Topology (standalone or HA, promotable members, Brokers):
        - Go version (only when built from source):
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How often has the behavior been observed?
      options:
        - Always
        - Intermittent
        - Observed once
        - Not reproduced yet
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: Reproduction Frequency
      description: The measured frequency, when known.
      placeholder: "Example: 1 of about 45 runs"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The smallest known sequence that produces the problem, if known.
      placeholder: |
        1. Create ...
        2. Wait until ...
        3. Delete / stop / change ...
        4. Observe ...
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Observed Impact
      description: Describe the effect you saw. Report what was observed; do not rate its severity.
      placeholder: |
        Examples:
        - writes were unavailable for about 10 seconds
        - a slave stayed behind while the cluster reported healthy
        - the first SQL transaction failed after the Pod became Ready
        - no data loss was observed
    validations:
      required: false

  - type: textarea
    id: expected-basis
    attributes:
      label: Basis for the Expected Behavior
      description: Where the expectation comes from, when known. External reporters may leave this blank.
      placeholder: |
        Examples:
        - docs/adr/0005-failover-split-brain.md
        - docs/testing/scenario-contract.md, scenario S03
        - the CUBRID 11.4 manual
        - an experiment in docs/poc/RESULTS.md
    validations:
      required: false

  - type: textarea
    id: known-facts
    attributes:
      label: Confirmed Facts
      description: Only what the evidence above shows directly.
      placeholder: |
        Examples:
        - the Pod was Ready before the SQL error
        - ReplicationHealthy was False with reason ReplicationStalled
        - no committed row was missing
    validations:
      required: false

  - type: textarea
    id: unknowns
    attributes:
      label: Suspected Cause and Open Questions
      description: A suspected cause and other open questions. Write them here as hypotheses, not as facts.
      placeholder: |
        Examples:
        - whether the database server restarted
        - whether the transaction was committed
        - whether this happens on a native amd64 host
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: A known temporary workaround, or "none".
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related Issues
      description: Related issues or PRs, if any.
      placeholder: "#123"
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive Information
      options:
        - label: I removed credentials, tokens, kubeconfigs, customer data and unredacted Secrets from the information above.
          required: true
