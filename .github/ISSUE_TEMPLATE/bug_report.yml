name: Bug Report
description: Report a bug in the CUBRID Kubernetes Operator
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `fix:` title prefix. You do not need to apply labels;
        maintainers assign priority and size after triage.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug
      placeholder: What is the bug about?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment
      placeholder: |
        - Operator version or commit:
        - Go version (only when built from source): go1.26
        - CUBRID engine image (tag/digest): cubrid/cubrid:11.4
        - Kubernetes distribution and version: Kind v1.33
        - CSI / StorageClass:
        - Topology (promotable members, Brokers):
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the bug here
      placeholder: CubridCluster manifest, status Conditions, Events, Operator and Instance Manager logs, etc.
    validations:
      required: false
