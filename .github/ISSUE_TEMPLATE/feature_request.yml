name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `feat:` title prefix. Search open and recently closed issues
        first. You do not need to apply labels; maintainers assign priority,
        size and phase after triage.

        A change to the CRD, HA safety, data lifecycle, backup/restore
        semantics or the Instance Manager API needs design agreement (an ADR)
        before implementation. Leave out credentials, kubeconfigs and
        unredacted Secrets.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve, and for whom?
      placeholder: Describe the problem or use case this feature addresses
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected Behavior
      description: The result you need, as someone using or operating a cluster would see it.
      placeholder: What should a user or an operator be able to do or observe?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the feature includes, and what it deliberately leaves out.
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Concrete, checkable conditions that would make this request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How it could be implemented, if you have an idea. It is not binding; the design is decided in review.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Dependencies, related issues and PRs, documentation links.
    validations:
      required: false
