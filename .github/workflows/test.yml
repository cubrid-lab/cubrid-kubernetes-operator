name: Tests

# Pull requests run on pull_request (which also covers fork PRs) and main on
# push; a push to a PR branch would otherwise run every job twice. A newer
# push to the same PR cancels the superseded run. Run a branch without a
# PR with `gh workflow run test.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pull request runs share a group; every main or manual run is kept.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # make verify runs check-generated, format-check, vet, lint and test.
      # None of them writes the workspace: check-generated regenerates CRDs,
      # RBAC and DeepCopy, runs go fmt and go mod tidy in a temporary copy, and
      # fails if the result differs from what is committed (#104, #535).
      - name: Verify generated files, formatting, vet, lint and tests
        run: make verify

      # None of the checks above may write a tracked or unignored file.
      - name: Check that make verify left the workspace unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "error: make verify changed the workspace." >&2
            exit 1
          fi

      # A stale generated file must fail check-generated and leave the
      # workspace as it was.
      - name: Check that check-generated reports a stale CRD and writes nothing
        run: |
          f=api/v1alpha1/cubridcluster_types.go
          sed -i '0,/^type CubridClusterSpec struct {/s//&\n\tStaleCheck *string `json:"staleCheck,omitempty"`/' "$f"
          git add "$f"
          before="$(git status --porcelain; git diff; git diff --cached)"
          if make check-generated; then
            echo "error: check-generated passed although the CRD and DeepCopy are stale." >&2
            exit 1
          fi
          after="$(git status --porcelain; git diff; git diff --cached)"
          if [ "$after" != "$before" ]; then
            git status --porcelain
            echo "error: check-generated changed the workspace." >&2
            exit 1
          fi
