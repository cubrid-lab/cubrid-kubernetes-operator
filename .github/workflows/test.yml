name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      # make test regenerates CRDs, RBAC and DeepCopy and runs go fmt, and the
      # step above runs go mod tidy, all in this workspace. Without this check a
      # PR with stale generated files or an untidy go.mod passed, because CI
      # quietly fixed its own copy (#104).
      - name: Verify generated files and go.mod are committed
        run: make verify
