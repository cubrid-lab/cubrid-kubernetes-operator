name: Lint

# Pull requests run on pull_request (which also covers fork PRs) and main on
# push; a push to a PR branch would otherwise run every job twice. A newer
# push to the same PR cancels the superseded run. Run a branch without a
# PR with `gh workflow run lint.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pull request runs share a group; every main or manual run is kept.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  impact:
    uses: ./.github/workflows/ci-impact.yml
    permissions:
      pull-requests: read

  lint:
    needs: impact
    # Failure to classify changes must never skip a required check.
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.go_lint != 'false') }}
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go module and build cache is kept under a key of this workflow's
      # own. With go.sum alone the key is shared by every workflow, and the
      # first job to save it was the few-second document check, so Go jobs
      # restored about 13 MB and compiled every dependency again (#1109).
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/lint.yml

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
