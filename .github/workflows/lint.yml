name: Lint

# Pull requests run on pull_request (which also covers fork PRs) and main on
# push; a push to a PR branch would otherwise run every job twice. A newer
# push to the same PR cancels the superseded run. Run a branch without a
# PR with `gh workflow run lint.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pull request runs share a group; every main or manual run is kept.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
