name: Security Scans

# Reachable-vulnerability check (#131). govulncheck reports only vulnerabilities
# the code can actually call, so a finding here is actionable rather than a
# transitive advisory. Runs on PRs, on main and weekly, because a new advisory
# can make an unchanged commit vulnerable.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  # A new PR push cancels only an obsolete PR scan, never main or schedules.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  impact:
    uses: ./.github/workflows/ci-impact.yml
    permissions:
      pull-requests: read

  govulncheck:
    needs: impact
    # Failure to classify changes must never skip a required check.
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.govulncheck != 'false') }}
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    # A hung module download would otherwise hold the runner for the default 6 hours.
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go module and build cache is kept under a key of this workflow's
      # own. With go.sum alone the key is shared by every workflow, and the
      # first job to save it was the few-second document check, so Go jobs
      # restored about 13 MB and compiled every dependency again (#1109).
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/security.yml

      - name: Run govulncheck
        run: make security
