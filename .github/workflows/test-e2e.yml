name: E2E Tests

# Pull requests run on pull_request (which also covers fork PRs) and main on
# push; a push to a PR branch would otherwise run every job twice. A newer
# push to the same PR cancels the superseded run. Run a branch without a
# PR with `gh workflow run test-e2e.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pull request runs share a group; every main or manual run is kept.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  impact:
    uses: ./.github/workflows/ci-impact.yml
    permissions:
      pull-requests: read

  test-e2e:
    needs: impact
    # Failure to classify changes must never skip a required check.
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.go_e2e != 'false') }}
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # Outside the step limit below, so that the evidence upload still runs.
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go module and build cache is kept under a key of this job's own.
      # With go.sum alone the key is the same in every workflow, and the
      # first job to save it is the few-second documentation check in the
      # Tests workflow, so this job restored about 13 MB and downloaded and
      # compiled every dependency again, about two minutes a run, in
      # `go vet`, `make install` and the test build. Adding this file to the
      # key gives the job a cache it saves itself. Only the cache key
      # changes: the cache is restored and saved as before, and every step
      # below runs unchanged.
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/test-e2e.yml

      # The kind version and its node image are pinned in the Makefile.
      # `make kind` downloads kind's modules from the Go proxy; a passing
      # network error there failed whole runs, so it is tried up to three
      # times, 15 s apart.
      - name: Install the pinned version of kind
        run: |
          for attempt in 1 2 3; do
            if make kind; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::make kind failed 3 times"
              exit 1
            fi
            echo "make kind failed (attempt $attempt of 3); trying again in 15 s"
            sleep 15
          done
          bin/kind version

      # Outside the run's own deadlines in the Makefile (E2E_GO_TIMEOUT 73m),
      # with room for creating the Kind cluster and building before the run.
      - name: Running Test e2e
        timeout-minutes: 80
        env:
          E2E_EVIDENCE_DIR: ${{ github.workspace }}/e2e-evidence
        run: make test-e2e

      # Kept for failed runs too: the record says what ran and on which images.
      # A run that found a credential in its evidence, or could not search it,
      # leaves a marker, and that evidence is never published. A run killed
      # before the search leaves none, and its files were written through the
      # redaction only.
      - name: Upload the scenario evidence
        if: ${{ always() && hashFiles('e2e-evidence.held') == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: e2e-evidence/
          if-no-files-found: warn
