name: E2E Tests

# Pull requests run on pull_request (which also covers fork PRs) and main on
# push; a push to a PR branch would otherwise run every job twice. A newer
# push to the same PR cancels the superseded run. Run a branch without a
# PR with `gh workflow run test-e2e.yml --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The kind version and its node image are pinned in the Makefile.
      - name: Install the pinned version of kind
        run: |
          make kind
          bin/kind version

      - name: Running Test e2e
        env:
          E2E_EVIDENCE_DIR: ${{ github.workspace }}/e2e-evidence
        run: |
          go mod tidy
          make test-e2e

      # Kept for failed runs too: the record says what ran and on which images.
      - name: Upload the scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: e2e-evidence/
          if-no-files-found: warn
