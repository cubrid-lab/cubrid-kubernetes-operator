name: Release PR

# Keeps the release PR up to date (#124). After each merge to main,
# release-please reads release-please-config.json (release-type: go) and
# .release-please-manifest.json and opens or updates one PR that sets the next
# version and its CHANGELOG.md section. It never creates a tag or a GitHub
# Release (skip-github-release), so no merge publishes anything, the release
# PR's merge included: publication is publish.yml, started by a maintainer and
# approved through the `production` environment.
#
# The action's own release-type input is left out on purpose: given that
# input, the action builds its configuration from its inputs and ignores the
# repository's config and manifest files.
#
# The PR is written with an installation token of the release-PR App, not
# with GITHUB_TOKEN or a personal token: CI on a PR that GITHUB_TOKEN opens or
# updates does not start on its own. This App is not the publishing App: it
# is no bypass actor of the `v*` tag ruleset, so its token cannot create a
# release tag. An admin stores its Client ID and private key as the secrets
# RELEASE_PR_APP_CLIENT_ID and RELEASE_PR_APP_PRIVATE_KEY of the `release-pr`
# environment (docs/testing/release-version-check.md). Until then this job
# warns and updates no PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-pr:
    # A fork has no App and no right to this repository's release PR.
    if: github.repository == 'cubrid-lab/cubrid-kubernetes-operator'
    name: Open or update the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App credential is a secret of this environment, which an admin
    # limits to main and gives no reviewers, so that a workflow on another
    # branch cannot read it.
    environment: release-pr
    # The App token does all the writing; GITHUB_TOKEN gets nothing.
    permissions: {}
    steps:
      # The publishing App's key belongs only to the production environment.
      # Visible here, any change merged to main could mint a token that may
      # create release tags without production's reviewers.
      - name: Refuse the publishing App key outside production
        env:
          PUBLISH_KEY_VISIBLE: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$PUBLISH_KEY_VISIBLE" != false ]; then
            echo "::error::RELEASE_APP_PRIVATE_KEY, the publishing App's key, is visible to the release-pr job; an admin keeps it only in the production environment"
            exit 1
          fi

      - name: Check that the release-PR App credential is provisioned
        id: app
        env:
          HAS_CLIENT_ID: ${{ secrets.RELEASE_PR_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = true ] && [ "$HAS_PRIVATE_KEY" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::RELEASE_PR_APP_CLIENT_ID or RELEASE_PR_APP_PRIVATE_KEY is not set; the release PR was not updated"
          echo "The release-PR App credential is not provisioned, so the release PR was not opened or updated." >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      # Scoped to this repository (the default without `owner`) and to the
      # two permissions release-please needs.
      - name: Create a release-PR App token
        id: token
        if: steps.app.outputs.ready == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release PR
        if: steps.app.outputs.ready == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
