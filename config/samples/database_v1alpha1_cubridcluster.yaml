# A single-member CubridCluster (ADR-0001: HA disabled, one promotable member).
# The operator needs its Instance Manager token Secret before it creates DB Pods;
# see config/manager/manager.yaml.
# Clients connect through the Broker Services: cubridcluster-sample-rw:33000
# (reads and writes) and cubridcluster-sample-ro:33001 (reads of the same one
# server; writes are refused with -581, docs/poc/RESULTS.md POC-33).
apiVersion: database.cubrid.io/v1alpha1
kind: CubridCluster
metadata:
  labels:
    app.kubernetes.io/name: cubrid-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: cubridcluster-sample
spec:
  version: "11.4"
  databases:
    - name: appdb
  topology:
    promotableMembers: 1
    readReplicas: 0
  highAvailability:
    enabled: false
  storage:
    data:
      size: 1Gi
