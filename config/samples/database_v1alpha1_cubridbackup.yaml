# For the database in database_v1alpha1_cubridcluster.yaml.
# This is not a self-contained backup setup: first configure an accessible,
# credentialed object store in the CubridCluster's spec.objectStorage and
# confirm the destination bucket and credentials. See docs/operations/README.md.
apiVersion: database.cubrid.io/v1alpha1
kind: CubridBackup
metadata:
  labels:
    app.kubernetes.io/name: cubrid-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: cubridbackup-sample
spec:
  clusterRef:
    name: cubridcluster-sample
  database: appdb
  target:
    preference: PreferStandby
  level: Full
  destination:
    type: ObjectStorage
    objectStorage:
      provider: S3Compatible
      bucket: cubrid-backups
      prefix: prod/example
