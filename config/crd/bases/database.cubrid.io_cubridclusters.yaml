            - message: 'an HA cluster needs objectStorage with a bucket: its first
                database is copied to the other members through it'
              rule: '!self.highAvailability.enabled || (has(self.objectStorage) &&
                has(self.objectStorage.bucket) && self.objectStorage.bucket.size()
                > 0)'
            - message: 'topology.promotableMembers cannot be changed after the cluster
                is created: v1alpha1 has no procedure to add or remove members'
