                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          storageClassName selects the StorageClass for the data volume. It is
                          fixed when the cluster is created.
                        type: string
                    required:
                    - size
                    type: object
