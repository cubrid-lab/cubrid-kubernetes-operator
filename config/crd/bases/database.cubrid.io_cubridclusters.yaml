                == 1 : true'
            - message: when highAvailability.enabled is true, v1alpha1 requires exactly
                3 promotable members
              rule: 'self.highAvailability.enabled ? self.topology.promotableMembers
                == 3 : true'
            - message: fencingPolicy Automatic is not supported in v1alpha1
