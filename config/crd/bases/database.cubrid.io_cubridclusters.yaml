            - databases
            - highAvailability
            - storage
            - topology
            - version
            type: object
            x-kubernetes-validations:
            - message: each database must have a non-empty name
              rule: self.databases.all(d, d.name.size() > 0)
            - message: readReplicas must be 0 in v1alpha1 (CUBRID replica role not
                supported)
              rule: self.topology.readReplicas == 0
            - message: when highAvailability.enabled is false, topology.promotableMembers
                must be 1
              rule: '!self.highAvailability.enabled ? self.topology.promotableMembers
                == 1 : true'
            - message: when highAvailability.enabled is true, v1alpha1 requires exactly
                3 promotable members
              rule: 'self.highAvailability.enabled ? self.topology.promotableMembers
                == 3 : true'
            - message: fencingPolicy Automatic is not supported in v1alpha1
              rule: self.highAvailability.fencingPolicy != 'Automatic'
            - message: database names are immutable; existing names must be preserved
              rule: oldSelf.databases.all(o, self.databases.exists(n, n.name == o.name))
