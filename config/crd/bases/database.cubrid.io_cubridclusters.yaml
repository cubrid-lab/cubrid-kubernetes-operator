                    enum:
                    - Disabled
                    - Manual
                    - Automatic
                    type: string
                required:
                - enabled
                type: object
              image:
                description: image selects the operator-compatible CUBRID image (ADR-0003).
                properties:
                  repository:
                    description: repository is the container image repository.
                    type: string
                  tag:
                    description: tag is the container image tag. Prefer pinning by
                      digest via repository@sha256.
                    type: string
                type: object
              resources:
                description: resources sets container resource requirements for the
