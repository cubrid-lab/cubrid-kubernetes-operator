              storage:
                description: storage configures the per-instance data volume.
                properties:
                  data:
                    description: data is the primary database data volume.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          size is the requested data volume size. It is fixed when the cluster is
