                  cluster is being restored from a backup manifest.
                properties:
                  manifestUri:
                    description: manifestUri is the artifact being restored (provenance).
                    type: string
                  mode:
                    description: mode is the bootstrap mode; "Recovery" for restore-from-backup.
                    type: string
                  operationID:
                    description: operationID is the Instance Manager restore operation
                      on targetMember.
                    type: string
                  phase:
                    description: phase is the recovery lifecycle phase.
                    type: string
                  targetMember:
                    description: targetMember is the initial master pod being restored
                      into.
                    type: string
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the CubridCluster. Conditions
                  are the source of truth (phase, if any, is informational only). Notable
                  types: Ready, HAReady, PrimaryResolved, RoutingReady, Degraded,
                  FencingRequired, Progressing, Updating (ADR-0005/0006/0009).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentPrimary:
                description: |-
                  currentPrimary is the currently observed master instance name. Unset when
                  no primary is resolved or the primary is ambiguous (ADR-0001/0005).
                type: string
              databases:
                description: databases reports coarse per-database state.
                items:
                  description: DatabaseStatus reports coarse per-database state (ADR-0010).
                  properties:
                    haConfigured:
                      description: haConfigured indicates the DB is in ha_db_list
                        on all nodes.
                      type: boolean
                    name:
                      description: name is the database name.
                      type: string
                    phase:
                      description: phase is a coarse database lifecycle phase.
                      enum:
                      - Pending
                      - Creating
                      - Created
                      - Failed
                      - Blocked
                      type: string
                    primaryCreated:
                      description: primaryCreated indicates the DB exists on the master.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              instances:
                description: instances reports per-instance observed state.
                items:
                  description: InstanceStatus reports the observed state of one CUBRID
                    instance (ADR-0001).
                  properties:
                    imageID:
                      description: imageID is the resolved container image ID/digest
                        of this member.
                      type: string
                    name:
                      description: name is the instance (StatefulSet pod / short HA
                        hostname) name.
                      type: string
                    observedEngineVersion:
                      description: |-
                        observedEngineVersion is the CUBRID engine version observed on this member
                        (ADR-0009 update-vs-upgrade guard). Never inferred from the image tag.
                      type: string
                    ordinal:
                      description: ordinal is the StatefulSet ordinal.
                      format: int32
                      type: integer
                    ready:
                      description: ready indicates the instance passed its per-instance
                        readiness (ADR-0006 catch-up).
                      type: boolean
                    role:
                      description: role is the CUBRID runtime role; unknown when not
                        authoritatively observed.
                      enum:
                      - master
                      - slave
                      - replica
                      - unknown
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedEngineVersion:
                description: |-
                  observedEngineVersion is the CUBRID engine version observed across the
                  cluster (ADR-0009). Recorded once initialized and used as the immutable
                  baseline the desired spec.version is checked against.
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the operator.
                format: int64
                type: integer
              update:
                description: update reports rolling-update progress (ADR-0009).
                properties:
                  currentRevision:
                    description: currentRevision is the revision currently observed.
                    type: string
                  desiredRevision:
                    description: desiredRevision is the StatefulSet revision the operator
                      is rolling toward.
                    type: string
                  engineVersion:
                    description: |-
                      engineVersion is the engine version the update targets (must equal the
                      observed baseline; a change is an upgrade, not an update).
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
