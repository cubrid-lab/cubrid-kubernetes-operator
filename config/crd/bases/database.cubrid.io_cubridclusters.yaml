                      enabled turns on CUBRID HA configuration. When false, v1alpha1 supports
                      only a single standalone promotable member (ha_mode=off).
                    type: boolean
                  fencingPolicy:
                    default: Manual
                    description: |-
                      fencingPolicy controls operator fencing (ADR-0005). Automatic is rejected
