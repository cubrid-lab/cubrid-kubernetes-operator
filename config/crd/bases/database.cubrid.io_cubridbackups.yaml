---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: cubridbackups.database.cubrid.io
spec:
  group: database.cubrid.io
  names:
    kind: CubridBackup
    listKind: CubridBackupList
    plural: cubridbackups
    singular: cubridbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.targetInstance
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CubridBackup is the Schema for the cubridbackups API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CubridBackup
            properties:
              clusterRef:
                description: clusterRef selects the CubridCluster to back up (same
                  namespace).
                properties:
                  name:
                    description: name is the referenced object's name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              database:
                description: |-
                  database is the CUBRID database to back up. Explicit even though
                  v1alpha1 supports exactly one database per cluster (ADR-0010).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z][a-z0-9_]*$
                type: string
              destination:
                description: destination is where the artifact is stored (ADR-0007).
                properties:
                  objectStorage:
                    description: |-
                      objectStorage configures the S3-compatible destination. Required when
                      type is ObjectStorage.
                    properties:
                      bucket:
                        description: bucket is the target bucket.
                        minLength: 1
                        type: string
                      credentialsRef:
                        description: credentialsRef references a Secret with object-storage
                          credentials.
                        properties:
                          name:
                            description: name is the referenced object's name.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      endpointRef:
                        description: endpointRef references a ConfigMap/Secret with
                          the endpoint.
                        properties:
                          name:
                            description: name is the referenced object's name.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      prefix:
                        description: prefix is the key prefix under the bucket.
                        type: string
                      provider:
                        default: S3Compatible
                        description: provider identifies the object-storage provider.
                        enum:
                        - S3Compatible
                        type: string
                    required:
                    - bucket
                    - credentialsRef
                    type: object
                  type:
                    description: |-
                      type selects the destination backend. ObjectStorage is required for
                      production; PVC is dev-only (not durable enough for HA rebuild / DR).
                    enum:
                    - ObjectStorage
                    - PVC
                    type: string
                required:
                - type
                type: object
              level:
                default: Full
                description: |-
                  level is the backup level. v1alpha1 supports Full only (CUBRID level 0);
                  incremental chains are deferred.
                enum:
                - Full
                type: string
              target:
                default:
                  preference: PreferStandby
                description: target selects which HA member runs the backup (ADR-0005/0007).
                properties:
                  preference:
                    default: PreferStandby
                    description: preference selects which HA role runs the backup.
                    enum:
                    - PreferStandby
                    - StandbyOnly
                    - PrimaryOnly
                    type: string
                type: object
            required:
            - clusterRef
            - database
            - destination
            type: object
          status:
            description: status defines the observed state of CubridBackup
            properties:
              artifact:
                description: artifact describes the completed backup (set on success).
                properties:
                  cubridVersion:
                    description: cubridVersion is the engine version that produced
                      the backup.
                    type: string
                  database:
                    description: database is the backed-up database name.
                    type: string
                  level:
                    description: level is the backup level.
                    type: string
                  manifestDigest:
                    description: manifestDigest is the manifest checksum.
                    type: string
                  sizeBytes:
                    description: sizeBytes is the total artifact size.
                    format: int64
                    type: integer
                  uri:
                    description: uri points at the manifest.json (the atomic completion
                      marker).
                    type: string
                type: object
              completedAt:
                description: completedAt is when the backup reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the CubridBackup resource
                  (Accepted/Ready with open-ended reasons, ADR-0007).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fallbackUsed:
                description: fallbackUsed is true when a standby-preferred backup
                  fell back to master.
                type: boolean
              observedGeneration:
                description: observedGeneration is the spec generation reflected by
                  this status.
                format: int64
                type: integer
              operationRef:
                description: operationRef is the Instance Manager operation ID (idempotent
                  contract).
                type: string
              phase:
                description: phase is the high-level backup lifecycle phase.
                type: string
              startedAt:
                description: startedAt is when the backup started.
                format: date-time
                type: string
              targetInstance:
                description: targetInstance is the pod selected to run the backup.
                type: string
              targetRole:
                description: targetRole is the ADR-0005 role of the target at backup
                  start.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
