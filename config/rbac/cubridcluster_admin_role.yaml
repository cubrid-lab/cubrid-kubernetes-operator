# This rule is not used by the project cubrid-kubernetes-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over database.cubrid.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cubrid-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: cubridcluster-admin-role
rules:
- apiGroups:
  - database.cubrid.io
  resources:
  - cubridclusters
  verbs:
  - '*'
- apiGroups:
  - database.cubrid.io
  resources:
  - cubridclusters/status
  verbs:
  - get
